[package]
name = "nomen"
version = "0.1.0"
edition = "2021"
description = "A desktop file manager with metadata superpowers"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
turso = "0.5"
tokio = { version = "1", features = ["full"] }
dirs = "6"
notify = "6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3.27.0"
